<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Source for og-image.jpg. Render at 1200x630:
     chrome --headless --force-device-scale-factor=2 --window-size=1200,630 \
            --screenshot=out.png file://<path>/og-card.html
     then downscale to 1200x630 and save as JPEG q90 (WhatsApp skips
     preview images much over ~300KB). -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    padding: 84px 88px;
    display: flex; flex-direction: column; justify-content: center;
    background: #EEE3C0;                       /* champagne */
    font-family: 'Geist', -apple-system, sans-serif;
    color: #33465A;                            /* ink */
  }
  /* The brand's cropped double-l, solid heather — no opacity trick. */
  .mark-bg {
    position: absolute; right: -4%; top: 50%; transform: translateY(-46%);
    width: 430px; aspect-ratio: 1 / .83; background: #B6C4CD;
    -webkit-mask: url(villie-emblem.png) no-repeat center / contain;
            mask: url(villie-emblem.png) no-repeat center / contain;
  }
  .inner { position: relative; z-index: 1; max-width: 740px; }
  /* The wordmark itself: one trimmed SVG, recoloured by currentColor. */
  .wm {
    display: block; height: 46px; aspect-ratio: 432.53 / 128.88;
    background: #6083A3;                       /* glaucous */
    -webkit-mask: url(villie-wordmark.svg) no-repeat left center / contain;
            mask: url(villie-wordmark.svg) no-repeat left center / contain;
    margin-bottom: 54px;
  }
  h1 { font-size: 64px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 500; }
  p  { font-size: 25px; line-height: 1.4; letter-spacing: -0.015em; color: #6E7180; margin-top: 26px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark-bg"></div>
    <div class="inner">
      <span class="wm" role="img" aria-label="villie"></span>
      <h1>Motherhood Simplified.<br>Confidence Amplified.</h1>
      <p>The week-by-week manual for your baby's first year.</p>
    </div>
  </div>
</body>
</html>
